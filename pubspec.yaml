name: irsal_hai
description: إرسال HAI - مشاركة محلية سريعة بين Android وWindows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.svg

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256
